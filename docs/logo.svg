<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 100 100" role="img" aria-labelledby="t">
  <title id="t">sg logo</title>
  <!-- Diamond: git's outline, since sg's disk format is git's. -->
  <rect x="17" y="17" width="66" height="66" rx="12" transform="rotate(45 50 50)" fill="#0B7A69"/>
  <!-- Two commits joined by an S-shaped history line (the "s" in sg). -->
  <path d="M41 68 C41 50 59 50 59 32" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <circle cx="41" cy="68" r="6.5" fill="#FFFFFF"/>
  <circle cx="59" cy="32" r="6.5" fill="#FFFFFF"/>
  <!-- Dashed ring around the newest commit: the automatic safety snapshot. -->
  <circle cx="59" cy="32" r="12" fill="none" stroke="#F2B544" stroke-width="3" stroke-dasharray="4.2 3.2" stroke-linecap="round"/>
</svg>
